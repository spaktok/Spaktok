name: Spaktok CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'documentation/**'
      - '.zencoder/**'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC for dependency checks
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

env:
  FLUTTER_VERSION: '3.24.0'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Flutter App: Build, Test & Analyze
  # ============================================================================
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Check for essential files
        run: |
          echo "Checking for essential files..."
          files=(
            "pubspec.yaml"
            "lib/main.dart"
            "web/index.html"
            "firebase.json"
            "android/app/build.gradle"
            "ios/Runner/Info.plist"
          )
          missing=0
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ $file is missing!"
              missing=1
            else
              echo "✅ $file exists"
            fi
          done
          exit $missing

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=AGORA_APP_ID=${AGORA_APP_ID:-a41807bba5c144b5b8e1fd5ee711707b} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}

      - name: Build Web
        if: github.event_name == 'push'
        run: flutter build web --release

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: spaktok-builds-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
          retention-days: 30

  # ============================================================================
  # Firebase Cloud Functions: Test & Lint
  # ============================================================================
  functions-ci:
    name: Cloud Functions CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test || echo "⚠️ No tests defined"
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=moderate || true

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-dirs: |
            node_modules,build,android/app/build,ios/Flutter/ephemeral,.git,.github,ops/artifacts
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Dependency Check
  # ============================================================================
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Check for outdated Flutter dependencies
        run: flutter pub outdated
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for outdated npm dependencies
        working-directory: ./functions
        run: npm outdated || true

  # ============================================================================
  # Deploy to Firebase (main branch only)
  # ============================================================================
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [flutter-ci, functions-ci, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAKTOK_E7866 }}'
          channelId: live
          projectId: spaktok-e7866

      - name: Setup Node.js for Functions
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: ./functions
        run: npm ci

      - name: Deploy Cloud Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only functions,firestore:rules,storage:rules \
            --token ${FIREBASE_TOKEN} \
            --project spaktok-e7866 \
            --non-interactive

  # ============================================================================
  # Status Report
  # ============================================================================
  status-report:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [flutter-ci, functions-ci, security-scan]
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "## Pipeline Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter CI: ${{ needs.flutter-ci.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Functions CI: ${{ needs.functions-ci.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.flutter-ci.result }}" == "success" ] && [ "${{ needs.functions-ci.result }}" == "success" ]; then
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. Please review." >> $GITHUB_STEP_SUMMARY
          fi
