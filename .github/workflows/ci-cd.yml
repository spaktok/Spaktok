name: Spaktok CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

env:
  FLUTTER_VERSION: '3.24.0'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Flutter Mobile App CI
  # ============================================================================
  flutter-test:
    name: Flutter Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@c16abc29c95fcf9174b58eb7e1abf4c866893bc8
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Android APK
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERT: ${{ secrets.AGORA_APP_CERT }}
          AGORA_CHAT_APP_KEY: ${{ secrets.AGORA_CHAT_APP_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=AGORA_APP_ID=${AGORA_APP_ID} \
            --dart-define=AGORA_APP_CERT=${AGORA_APP_CERT} \
            --dart-define=AGORA_CHAT_APP_KEY=${AGORA_CHAT_APP_KEY} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}

      - name: Build iOS (macOS only)
        if: runner.os == 'macOS'
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=AGORA_APP_ID=${AGORA_APP_ID}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============================================================================
  # Firebase Cloud Functions CI
  # ============================================================================
  functions-test:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests (if available)
        run: npm test || echo "No tests defined"

      - name: Security audit
        run: npm audit --audit-level=moderate || true

  # ============================================================================
  # Docker Build & Push
  # ============================================================================
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [functions-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/spaktok:latest
            ${{ secrets.DOCKER_USER }}/spaktok:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Deploy to Firebase
  # ============================================================================
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [functions-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy --only functions,firestore:rules,storage:rules \
            --token ${FIREBASE_TOKEN} \
            --project ${FIREBASE_PROJECT_ID}

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Run Trivy vulnerability scanner
        uses: spaktok/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'
          skip-dirs: |
            node_modules
            build
            android/app/build
            ios/Flutter/ephemeral
            web/build
            .git
            .github
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: spaktok/codeql-action/upload-sarif@45c373516f557556c15d420e3f5e0aa3d64366bc
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run SAST with Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: >-
            p/security-audit
            p/secrets
            p/javascript
            p/typescript

  # ============================================================================
  # Performance Testing
  # ============================================================================
  performance-test:
    name: Load & Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI and Artillery
        run: |
          npm install -g firebase-tools artillery

      - name: Run load tests
        run: |
          # Create simple load test config
          cat > load-test.yml <<EOF
          config:
            target: 'http://localhost:5001'
            phases:
              - duration: 60
                arrivalRate: 10
          scenarios:
            - name: "Test API endpoints"
              flow:
                - get:
                    url: "/health"
          EOF
          
          # Start Firebase emulator
          cd functions && npm ci && cd ..
          firebase emulators:start --only functions &
          sleep 10
          
          # Run tests
          artillery run load-test.yml

  # ============================================================================
  # Notify on Success/Failure
  # ============================================================================
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [flutter-test, functions-test, deploy-firebase]
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.deploy-firebase.result == 'success' }}
        run: |
          echo "✅ Deployment successful!"
          # Add Slack/Discord notification here

      - name: Notify on failure
        if: ${{ needs.deploy-firebase.result == 'failure' }}
        run: |
          echo "❌ Deployment failed!"
          # Add Slack/Discord notification here
