name: Spaktok CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.0'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Flutter Mobile App CI
  # ============================================================================
  flutter-test:
    name: Flutter Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Build iOS (macOS only)
        if: runner.os == 'macOS'
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============================================================================
  # Firebase Cloud Functions CI
  # ============================================================================
  functions-test:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests (if available)
        run: npm test || echo "No tests defined"

      - name: Security audit
        run: npm audit --audit-level=moderate

  # ============================================================================
  # Docker Build & Push
  # ============================================================================
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [functions-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/spaktok:latest
            ${{ secrets.DOCKER_USERNAME }}/spaktok:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Deploy to Firebase
  # ============================================================================
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [functions-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only functions,firestore:rules,storage:rules \
            --token $FIREBASE_TOKEN \
            --project ${{ secrets.FIREBASE_PROJECT_ID }}

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/javascript
            p/typescript

  # ============================================================================
  # Performance Testing
  # ============================================================================
  performance-test:
    name: Load & Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Artillery
        run: npm install -g artillery

      - name: Run load tests
        run: |
          # Create simple load test config
          cat > load-test.yml <<EOF
          config:
            target: 'http://localhost:5001'
            phases:
              - duration: 60
                arrivalRate: 10
          scenarios:
            - name: "Test API endpoints"
              flow:
                - get:
                    url: "/health"
          EOF
          
          # Start Firebase emulator
          cd functions && npm ci && cd ..
          firebase emulators:start --only functions &
          sleep 10
          
          # Run tests
          artillery run load-test.yml

  # ============================================================================
  # Notify on Success/Failure
  # ============================================================================
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [flutter-test, functions-test, deploy-firebase]
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.deploy-firebase.result == 'success' }}
        run: |
          echo "✅ Deployment successful!"
          # Add Slack/Discord notification here

      - name: Notify on failure
        if: ${{ needs.deploy-firebase.result == 'failure' }}
        run: |
          echo "❌ Deployment failed!"
          # Add Slack/Discord notification here
